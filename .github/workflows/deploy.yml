# =============================================================================
# GentlemanBird Deploy Pipeline
# =============================================================================
# Builds the Docker image on push to master, pushes to GHCR, and triggers
# a Coolify redeploy at surf.beenex.org.
#
# Prerequisites:
#   1. Repository must be PUBLIC (for free GitHub Actions minutes)
#   2. COOLIFY_API_TOKEN and COOLIFY_API_URL secrets must be set in repo settings
# =============================================================================

name: Deploy GentlemanBird

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Build Docker image and push to GHCR
  # -------------------------------------------------------------------------
  # NOTE: fork-ci.yml still runs independently on push (macOS build + tests).
  # This pipeline only builds the linux/amd64 Docker image and deploys it.
  # -------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Timeout for the build itself (Ladybird C++ is heavy)
          # The job timeout-minutes above provides the outer guard.

  # -------------------------------------------------------------------------
  # Job 3: Trigger Coolify redeploy
  # -------------------------------------------------------------------------
  # Uses the Coolify v4 API to redeploy the docker image application.
  # Secrets required:
  #   COOLIFY_API_URL   - e.g. https://cloud.comfyspace.tech
  #   COOLIFY_API_TOKEN - Coolify API bearer token
  # -------------------------------------------------------------------------
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_APP_UUID: hrc2dd8ff1rjin1jjztarmb7
        run: |
          echo "🚀 Triggering Coolify redeploy at surf.beenex.org..."
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "${{ secrets.COOLIFY_API_URL }}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Coolify response ($http_code): $body"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Coolify redeploy triggered successfully"
